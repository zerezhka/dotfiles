# Hypridle configuration
# Idle management - flux screensaver + lock + dpms
#
# Flow: 5min -> flux screensaver (spans both monitors, dismisses on any input)
#       15min -> hyprlock (flux is killed first; it would be hidden under the lock)
#       45min -> screens off
#
# flux is killed on EVERY lock path so it never runs hidden behind hyprlock and
# is always gone by the time you unlock. `pkill -9` is harmless if it isn't running.

general {
    lock_cmd = pkill -9 flux-desktop; hyprlock
    before_sleep_cmd = pkill -9 flux-desktop; hyprlock
}

# Flux screensaver after 5 minutes.
# on-resume kills it when you return *before* the lock kicks in. flux also
# self-exits on any key/mouse event, so a wiggle wakes you instantly.
listener {
    timeout = 300
    on-timeout = ~/.local/bin/flux-desktop
    on-resume = pkill -9 flux-desktop
}

# Lock screen after 15 minutes. Kill flux as we lock (it would just sit hidden).
listener {
    timeout = 900
    on-timeout = pkill -9 flux-desktop; hyprlock
}

# Screen off after 45 minutes.
listener {
    timeout = 2700
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
