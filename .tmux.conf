# ~/.tmux.conf
# Project-per-session tmux config for Hyprland workflow.
# Model: 1 session = 1 project, windows = roles (nvim/server/logs/git), panes = split views.
# See ~/Projects/dotfiles/.local/bin/tmux-project for the session launcher.

# --- Prefix ---------------------------------------------------------------
# C-b requires an awkward reach; C-a is the classic screen-style alternative
# and is free in zsh/nvim (readline's C-a "start of line" isn't needed once
# you're inside tmux — vi-mode/nvim handle line-start differently anyway).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Terminal / color ------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"

# --- Core behavior ----------------------------------------------------------
set -g escape-time 10          # nvim needs this low or <Esc> in insert mode lags
set -g history-limit 50000
set -g base-index 1            # windows/panes start at 1, matches keyboard row
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on         # lets nvim autoread work when switching panes
set -g mouse off                # keyboard-driven workflow; flip to "on" if you want click-to-select

# --- Reload config -----------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- vim-style pane navigation/resizing -------------------------------------
setw -g mode-keys vi
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5

# splits, keep current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vi-style copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- window navigation by number (Alt+1..9, no prefix) ----------------------
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# quick prev/next window
bind -n M-n next-window
bind -n M-p previous-window

# --- session switching -------------------------------------------------------
# built-in tree view, fine for a handful of sessions
bind s choose-tree -Zs
# fzf-based switcher (see tmux-fzf-session plugin below), fast for many sessions
bind S run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# --- statusline: minimal, sessions + current window -------------------------
set -g status-position top
set -g status-style "bg=default"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[bold]#S #[default]"
set -g status-right "%H:%M"
setw -g window-status-current-format "#[bold]#I:#W#[default]"
setw -g window-status-format "#I:#W"
set -g status-justify centre

# --- plugins (TPM) -----------------------------------------------------------
# bootstrap: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# then inside tmux: prefix + I to install
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect/continuum: persist sessions across reboots (homelab ssh sessions
# you attach/detach from should survive a restart of the local terminal)
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
